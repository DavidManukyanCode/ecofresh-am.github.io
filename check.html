<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check your pack | Eat Fresh</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400;500;600;700&family=Noto+Serif+Armenian:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="check">
<header id="site-header"></header>
<main>
<section class="page-hero"><div class="wrap"><h1 data-i18n="batch_title"></h1><p class="lead" data-i18n="batch_lead"></p></div></section><section class="batch" id="batch">
  <div class="wrap">
    <div class="batch-grid">
      <form class="form-card" id="batchForm" novalidate>
        <div class="field">
          <label for="batchId" data-i18n="f_id"></label>
          <input type="text" id="batchId" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="K-261011-07" required>
          <p class="hint" data-i18n="f_id_hint"></p>
        </div>
        <button class="btn btn-primary" type="submit" data-i18n="f_btn"></button>
        <button class="linkbtn" type="button" id="trySample" data-i18n="f_try"></button>
        <p class="hint" id="formMsg" role="status" aria-live="polite"></p>
        <p class="hint idx" data-i18n="id_explain"></p>
      </form>
      <div class="result" id="result" aria-live="polite">
        <div class="empty"><p data-i18n="empty">Այստեղ կհայտնվեն քո խմբաքանակի տվյալները։</p></div>
      </div>
    </div>
  </div>
</section>
</main>
<footer id="contact"><div id="site-footer"></div></footer>
<script src="assets/app.js"></script>
</body>
</html>
